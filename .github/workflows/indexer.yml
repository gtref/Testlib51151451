name: GPM Indexer
on: [push]
permissions:
  contents: write
jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Index
        run: |
          # Find directories with metadata.json and list them
          find . -maxdepth 2 -not -path '*/.*' -name "metadata.json" | cut -d'/' -f2 > pkg_list.txt
      - name: Commit
        run: |
          git config --local user.email "gpm-bot@users.noreply.github.com"
          git config --local user.name "GPM Bot"
          git add pkg_list.txt
          git commit -m "Auto-update GPM index" || exit 0
          git push
          
